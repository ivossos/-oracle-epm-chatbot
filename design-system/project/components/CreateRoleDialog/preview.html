<!-- @dsCard group="Roles" height=380 subtitle="Open and close to compare enter and exit" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface-0);font-size:14px;line-height:20px}.slug{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}.btn{font:500 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:6px 12px;border:1px solid var(--border-strong);background:var(--surface-0);color:var(--ink);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}.btn:hover{background:var(--surface-100)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.primary:hover{background:var(--accent-hover)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-iteration-count:1!important;transition-property:opacity!important;transition-duration:var(--duration-fast)!important}}
.stage{position:relative;height:360px;overflow:hidden;background:var(--surface-100)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px}.bar h1{margin:0;font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.01em}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--duration-fast) var(--ease-exit)}
.dlg{position:absolute;left:50%;top:56px;width:380px;margin-left:-190px;box-sizing:border-box;padding:24px;background:var(--surface-0);border-radius:var(--radius-lg);box-shadow:var(--shadow-dialog);opacity:0;transform:translateY(8px) scale(.96);pointer-events:none;transition:opacity var(--duration-fast) var(--ease-exit),transform var(--duration-fast) var(--ease-exit)}
.open .scrim{opacity:1;pointer-events:auto;transition:opacity var(--duration-base) var(--ease-enter)}
.open .dlg{opacity:1;transform:none;pointer-events:auto;transition:opacity var(--duration-base) var(--ease-enter),transform var(--duration-base) var(--ease-enter)}
.dlg h2{margin:0 0 4px;font-size:16px;line-height:24px;font-weight:600}.dlg p{margin:0 0 16px;color:var(--ink-muted)}
label{display:block;font-weight:500;margin-bottom:4px}
input{box-sizing:border-box;width:100%;font:14px/20px var(--font-sans);padding:6px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface-0);color:var(--ink);margin-bottom:12px}
.f{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
</style>
<div class="stage" id="s">
<div class="bar"><h1>Authorization</h1><button class="btn primary" id="o">Create role</button></div>
<div class="scrim" id="sc"></div>
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt">
<h2 id="dt">Create role</h2><p>Roles group permissions you assign to members.</p>
<label for="n">Name</label><input id="n" value="Editor">
<label for="sl">Slug</label><input id="sl" class="slug" value="editor" style="font-family:var(--font-mono)">
<div class="f"><button class="btn" id="c">Cancel</button><button class="btn primary" id="k">Create role</button></div>
</div></div>
<script>
const s=document.getElementById('s');
document.getElementById('o').onclick=()=>{s.classList.add('open');setTimeout(()=>document.getElementById('n').focus(),200)};
['c','k','sc'].forEach(i=>document.getElementById(i).onclick=()=>s.classList.remove('open'));
setTimeout(()=>s.classList.add('open'),600);
</script>
