<!-- @dsCard group="Feedback" height=240 subtitle="Fire a toast; it dismisses after 4s" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface-0);font-size:14px;line-height:20px}.slug{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}.btn{font:500 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:6px 12px;border:1px solid var(--border-strong);background:var(--surface-0);color:var(--ink);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}.btn:hover{background:var(--surface-100)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.primary:hover{background:var(--accent-hover)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-iteration-count:1!important;transition-property:opacity!important;transition-duration:var(--duration-fast)!important}}
.stage{position:relative;height:220px;overflow:hidden;padding:16px;box-sizing:border-box}
.stack{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{position:relative;overflow:hidden;width:300px;box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;padding:12px 16px;background:var(--surface-0);border-radius:var(--radius-md);box-shadow:var(--shadow-popover);animation:tin var(--duration-slow) var(--ease-enter) both}
.toast.out{animation:tout var(--duration-base) var(--ease-exit) both}
@keyframes tin{from{opacity:0;transform:translateY(16px)}}
@keyframes tout{to{opacity:0;transform:translateY(8px)}}
.ic{font-weight:600}.ok{color:var(--success)}.err{color:var(--danger)}
.msg{flex:1}.msg b{font-weight:500}
.x{all:unset;cursor:pointer;color:var(--ink-muted);width:16px;text-align:center}
.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);animation:p 4000ms linear both;transform-origin:left}
@keyframes p{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.toast:hover .prog{animation-play-state:paused}
</style>
<div class="stage"><button class="btn primary" id="a">Save role</button> <button class="btn" id="e">Trigger error</button><div class="stack" id="s" aria-live="polite"></div></div>
<script>
const s=document.getElementById('s');
function toast(ok,txt){const t=document.createElement('div');t.className='toast';
t.innerHTML='<span class="ic '+(ok?'ok':'err')+'">'+(ok?'✓':'!')+'</span><span class="msg">'+txt+'</span><button class="x" aria-label="Dismiss">×</button><span class="prog"></span>';
const close=()=>{if(t.classList.contains('out'))return;t.classList.add('out');setTimeout(()=>t.remove(),200)};
t.querySelector('.x').onclick=close;t.querySelector('.prog').addEventListener('animationend',close);s.appendChild(t)}
document.getElementById('a').onclick=()=>toast(true,'Role <b>Editor</b> created');
document.getElementById('e').onclick=()=>toast(false,'Couldn’t save <b>billing:manage</b>. Try again.');
setTimeout(()=>toast(true,'Role <b>Editor</b> created'),500);
</script>
