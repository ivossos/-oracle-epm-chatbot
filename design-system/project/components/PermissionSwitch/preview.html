<!-- @dsCard group="Permissions" height=220 subtitle="Toggle to see thumb, track and save states" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface-0);font-size:14px;line-height:20px}.slug{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}.btn{font:500 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:6px 12px;border:1px solid var(--border-strong);background:var(--surface-0);color:var(--ink);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}.btn:hover{background:var(--surface-100)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.primary:hover{background:var(--accent-hover)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-iteration-count:1!important;transition-property:opacity!important;transition-duration:var(--duration-fast)!important}}
.wrap{margin:16px;border:1px solid var(--border);border-radius:var(--radius-lg)}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border)}.item:first-child{border-top:0}
.lbl{flex:1}.lbl b{display:block;font-weight:500}
.sw{all:unset;position:relative;width:36px;height:20px;border-radius:var(--radius-full);background:var(--surface-200);box-shadow:inset 0 0 0 1px var(--border-strong);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard),box-shadow var(--duration-instant) var(--ease-standard)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:var(--radius-full);background:#ffffff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--duration-fast) var(--ease-standard)}
.sw[aria-checked=true]{background:var(--accent);box-shadow:none}.sw[aria-checked=true]::after{transform:translateX(16px)}
.st{width:72px;font-size:12px;color:var(--ink-muted);display:flex;align-items:center;gap:4px;justify-content:flex-end}
.st>*{transition:opacity var(--duration-fast) var(--ease-enter)}
.spin{width:12px;height:12px;border:1.5px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:r 700ms linear infinite}
@keyframes r{to{transform:rotate(360deg)}}.ok{color:var(--success)}
</style>
<div class="wrap" id="w"></div>
<script>
const items=[["posts:write","Create and edit posts",true],["billing:manage","Change plan and invoices",false],["users:invite","Invite members",false]];
const w=document.getElementById('w');
items.forEach(([s,d,on])=>{const el=document.createElement('div');el.className='item';
el.innerHTML='<div class="lbl"><b class="slug" style="color:var(--ink)">'+s+'</b><span style="color:var(--ink-muted)">'+d+'</span></div><span class="st" aria-live="polite"></span><button class="sw" role="switch" aria-checked="'+on+'" aria-label="'+s+'"></button>';
const b=el.querySelector('.sw'),st=el.querySelector('.st');let tm;
b.onclick=()=>{b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');clearTimeout(tm);
st.innerHTML='<span class="spin"></span><span>Saving</span>';
tm=setTimeout(()=>{st.innerHTML='<span class="ok">✓ Saved</span>';tm=setTimeout(()=>{const k=st.firstChild;if(k){k.style.opacity=0;setTimeout(()=>st.innerHTML='',200)}},1200)},700)};
w.appendChild(el)});
</script>
