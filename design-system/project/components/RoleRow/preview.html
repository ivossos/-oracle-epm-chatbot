<!-- @dsCard group="Roles" height=300 subtitle="Click a role to expand its permissions" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap">
<style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--surface-0);font-size:14px;line-height:20px}.slug{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}.btn{font:500 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:6px 12px;border:1px solid var(--border-strong);background:var(--surface-0);color:var(--ink);cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}.btn:hover{background:var(--surface-100)}.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}.btn.primary:hover{background:var(--accent-hover)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-iteration-count:1!important;transition-property:opacity!important;transition-duration:var(--duration-fast)!important}}
.t{margin:16px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.row{border-top:1px solid var(--border)}.row:first-child{border-top:0}
.head{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background var(--duration-instant) var(--ease-standard)}
.head:hover{background:var(--surface-100)}.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chev{width:16px;height:16px;color:var(--ink-muted);transition:transform var(--duration-fast) var(--ease-standard)}
.row.open .chev{transform:rotate(90deg)}
.name{font-weight:500;flex:1}.count{font-size:12px;color:var(--ink-muted)}
.body{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows var(--duration-base) var(--ease-standard),opacity var(--duration-base) var(--ease-standard);background:var(--surface-100)}
.row.open .body{grid-template-rows:1fr;opacity:1}
.inner{overflow:hidden}.list{padding:8px 16px 12px 44px;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface-0);border-radius:var(--radius-sm);padding:2px 8px}
</style>
<div class="t" id="t"></div>
<script>
const roles=[["Admin","admin",["users:manage","billing:manage","roles:manage","posts:write"]],["Editor","editor",["posts:read","posts:write","media:upload"]],["Viewer","viewer",["posts:read"]]];
const t=document.getElementById('t');
roles.forEach(([n,s,p],i)=>{const r=document.createElement('div');r.className='row'+(i===1?' open':'');
r.innerHTML='<button class="head" aria-expanded="'+(i===1)+'"><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4l4 4-4 4"/></svg><span class="name">'+n+'</span><span class="slug">'+s+'</span><span class="count">'+p.length+' permissions</span></button><div class="body"><div class="inner"><div class="list">'+p.map(x=>'<span class="chip slug">'+x+'</span>').join('')+'</div></div></div>';
r.querySelector('.head').onclick=e=>{const o=r.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o)};t.appendChild(r)});
</script>
