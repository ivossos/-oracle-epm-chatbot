<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPMCopilot em ação</title>
<style>
/* Layout: phone-shaped chat column, header, message list that grows, composer at bottom. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #141824;
  --muted: #5f6678;
  --line: #dde1ea;
  --accent: #4b4ef0;
  --accent-soft: #e6e7fd;
  --user: #4b4ef0;
  --good: #1f8a5b;
  --bad: #c2412d;
  --warn-bg: #fff3dc;
  --warn: #9a5b00;
  --font: "Inter", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); display: flex; justify-content: center; }
.app { width: 100%; max-width: 540px; height: 100%; display: flex; flex-direction: column; background: var(--surface); }
header { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.hd { flex: 1; }
.hd b { display: block; font-size: 17px; }
.hd span { font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 5px; }
.badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); white-space: nowrap; }
.ctx { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #f8f9fc; }
.ctx span { font-size: 11.5px; font-family: var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.msgs { flex: 1; overflow: hidden; padding: 18px; display: flex; flex-direction: column; justify-content: flex-end; gap: 12px; }
.m { max-width: 86%; padding: 11px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .35s, transform .45s cubic-bezier(.2,.8,.2,1); }
.m.in { opacity: 1; transform: none; }
.u { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 5px; }
.b { align-self: flex-start; background: #f2f3f8; border-bottom-left-radius: 5px; }
.b strong { font-variant-numeric: tabular-nums; }
.neg { color: var(--bad); font-weight: 600; }
.pos { color: var(--good); font-weight: 600; }
.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); opacity: .4; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: 1; transform: translateY(-3px); } }
.card { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.card h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.br { display: grid; grid-template-columns: 62px 1fr 64px; align-items: center; gap: 8px; font-size: 12.5px; }
.br .t { position: relative; height: 16px; }
.br .o, .br .r { position: absolute; left: 0; height: 7px; border-radius: 4px; width: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
.br .o { top: 0; background: #c9cbe0; }
.br .r { top: 9px; background: var(--accent); }
.br .v { text-align: right; font-family: var(--mono); font-size: 11.5px; }
.leg { display: flex; gap: 12px; font-size: 11px; color: var(--muted); }
.leg i { display: inline-block; width: 10px; height: 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
.chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 99px; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); }
.chip.pri { background: var(--accent); color: #fff; }
.chip.press { transform: scale(.94); transition: transform .15s; }
.ok { display: flex; align-items: center; gap: 8px; }
.ok b { width: 22px; height: 22px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 13px; }
footer { padding: 12px 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.inp { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 22px; padding: 11px 16px; font-size: 15px; color: var(--ink); background: #f8f9fc; white-space: nowrap; overflow: hidden; }
.inp.ph { color: var(--muted); }
.caret { display: inline-block; width: 2px; height: 18px; background: var(--accent); vertical-align: -3px; animation: car 1s steps(1) infinite; }
@keyframes car { 50% { opacity: 0; } }
.send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; border: 0; }
@media (prefers-reduced-motion: reduce) { .m, .br .o, .br .r { transition: none; } .typing i, .caret { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">EPM</div>
    <div class="hd"><b>EPMCopilot</b><span><span class="dot"></span>Conectado ao Planning</span></div>
    <span class="badge">Demonstração · dados de exemplo</span>
  </header>
  <div class="ctx"><span>Cenário: Real</span><span>Versão: Working</span><span>Período: Out/26</span><span>Moeda: BRL</span></div>
  <div class="msgs" id="msgs"></div>
  <footer>
    <div class="inp ph" id="inp">Pergunte sobre seus planos e números…</div>
    <button class="send" type="button" aria-label="Enviar">➤</button>
  </footer>
</div>
<script>
const msgs = document.getElementById('msgs');
const inp = document.getElementById('inp');
const wait = ms => new Promise(r => setTimeout(r, ms));

async function type(text, speed = 38) {
  inp.classList.remove('ph');
  for (let i = 1; i <= text.length; i++) {
    inp.innerHTML = '';
    inp.textContent = text.slice(0, i);
    inp.insertAdjacentHTML('beforeend', '<span class="caret"></span>');
    await wait(speed);
  }
  await wait(250);
  inp.classList.add('ph');
  inp.textContent = 'Pergunte sobre seus planos e números…';
}
function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.innerHTML = html;
  msgs.appendChild(d);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('in')));
  return d;
}
async function bot(html, think = 1100) {
  const t = add('b', '<span class="typing"><i></i><i></i><i></i></span>');
  await wait(think);
  t.innerHTML = html;
  return t;
}

const regions = [
  ['Sudeste', 6.10, 6.05], ['Sul', 2.71, 3.02], ['Nordeste', 2.12, 2.18], ['Centro-O.', 1.47, 1.55]
];

async function run() {
  await wait(500);
  await type('Como ficou a receita de outubro vs. orçamento?');
  add('u', 'Como ficou a receita de outubro vs. orçamento?');
  await wait(400);
  const rows = regions.map(([n, r, o]) =>
    `<div class="br"><span>${n}</span><div class="t"><i class="o" data-w="${o / 6.2 * 100}"></i><i class="r" data-w="${r / 6.2 * 100}"></i></div><span class="v">${r.toFixed(2).replace('.', ',')}</span></div>`).join('');
  const m1 = await bot(
    'Receita de outubro: <strong>R$ 12,4 mi</strong>, <span class="neg">−3,1%</span> vs. orçamento (R$ 12,8 mi). O maior desvio é o <strong>Sul</strong>: <span class="neg">−R$ 310 mil</span>.' +
    `<div class="card"><h4>Receita por região · R$ mi</h4>${rows}<div class="leg"><span><i style="background:#c9cbe0"></i>Orçado</span><span><i style="background:var(--accent)"></i>Real</span></div></div>`);
  await wait(60);
  m1.querySelectorAll('[data-w]').forEach(e => e.style.width = e.dataset.w + '%');
  await wait(2600);

  await type('Atualize o forecast de novembro com essa tendência.');
  add('u', 'Atualize o forecast de novembro com essa tendência.');
  await wait(400);
  const m2 = await bot(
    'Forecast de novembro no cenário <strong>Forecast_Nov</strong>: <strong>R$ 13,1 mi</strong> (<span class="pos">+5,6%</span> vs. outubro). Quer que eu rode a regra de alocação de despesas?' +
    '<div class="chips"><span class="chip pri" id="c1">Rodar regra</span><span class="chip">Ver detalhes</span></div>', 1300);
  await wait(1700);
  const c = document.getElementById('c1');
  c.classList.add('press'); await wait(180); c.classList.remove('press');
  add('u', 'Rodar regra');
  await wait(300);
  await bot('<div class="ok"><b>✓</b><span>Regra <strong>Aloca_Despesas_Nov</strong> concluída em 14 s. 312 células atualizadas.</span></div>', 1500);
}
run();
</script>
</body>
</html>
