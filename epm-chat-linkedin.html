<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EPMCopilot para LinkedIn</title>
<style>
/* Layout: 16:9 stage; brand panel on the left, scaled chat window on the right. */
:root { --bg: #eef0f5; --accent: #4b4ef0; --deep: #2b2db8; --ink: #141824; --muted: #5f6678; --warn-bg: #fff3dc; --warn: #9a5b00; --font: "Inter", system-ui, sans-serif; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
body { background: linear-gradient(120deg, #f4f5fb 0%, #e7e9f6 100%); font-family: var(--font); color: var(--ink); position: relative; }
.left { position: absolute; left: 110px; top: 150px; width: 760px; display: grid; gap: 26px; }
.brand { display: flex; align-items: center; gap: 22px; }
.mark { width: 96px; height: 96px; border-radius: 26px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 32px; }
.word { font-size: 76px; font-weight: 800; letter-spacing: -2px; }
.word span { font-weight: 400; }
h2 { margin: 0; font-size: 50px; line-height: 1.15; font-weight: 700; letter-spacing: -1px; text-wrap: balance; }
p { margin: 0; font-size: 26px; color: var(--muted); line-height: 1.45; max-width: 680px; }
.badge { justify-self: start; font-size: 20px; font-weight: 600; padding: 6px 16px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }
.frame { position: absolute; right: 110px; top: 40px; width: 540px; height: 645px; transform: scale(1.55); transform-origin: top right;
  border-radius: 18px; overflow: hidden; box-shadow: 0 30px 70px rgba(30, 32, 90, .18); border: 1px solid #d9dcea; background: #fff; }
iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><div class="mark">EPM</div><div class="word">EPM<span>Copilot</span></div></div>
    <h2>Seu planejamento no Oracle EPM, em uma conversa.</h2>
    <p>Pergunte sobre receita, desvios e forecast. Rode regras de negócio sem sair do chat.</p>
    <span class="badge">Demonstração · dados de exemplo</span>
  </div>
  <div class="frame"><iframe src="epm-chat-motion.html" title="Chat EPMCopilot"></iframe></div>
</body>
</html>
